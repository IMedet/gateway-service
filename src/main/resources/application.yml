server:
  port: 8888
  forward-headers-strategy: framework
spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders:
                  - Authorization
                allowCredentials: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/qonaqzhai/auth/**
              filters:
                - RewritePath=/qonaqzhai/auth(?<segment>/?.*), /api/auth${segment}

            - id: administration
              uri: lb://administration
              predicates:
                - Path=/qonaqzhai/admin/**
              filters:
                - RewritePath=/qonaqzhai/admin(?<segment>/?.*), ${segment}
                - AuthenticationFilter

            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/qonaqzhai/events/**
              filters:
                - RewritePath=/qonaqzhai/events(?<segment>/?.*), /events${segment}
                - AuthenticationFilter


eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN