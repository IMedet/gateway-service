server:
  port: 8888
  forward-headers-strategy: framework
spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders:
                  - Authorization
                allowCredentials: false
          routes:
            - id: auth-h2-console
              uri: lb://auth-service
              predicates:
                - Path=/qonaqzhai/auth/h2-console/**
              filters:
                - RewritePath=/qonaqzhai/auth/h2-console(?<segment>/?.*), /h2-console${segment}
                - AddRequestHeader=X-Forwarded-Prefix, /qonaqzhai/auth
                - PreserveHostHeader
                - InternalGatewaySignature

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/qonaqzhai/auth/**
              filters:
                - RewritePath=/qonaqzhai/auth(?<segment>/?.*), /api/auth${segment}
                - InternalGatewaySignature

            - id: administration-h2-console
              uri: lb://administration
              predicates:
                - Path=/qonaqzhai/admin/h2-console,/qonaqzhai/admin/h2-console/**
              filters:
                - RewritePath=/qonaqzhai/admin/h2-console(?<segment>/?.*), /h2-console${segment}
                - AddRequestHeader=X-Forwarded-Prefix, /qonaqzhai/admin
                - PreserveHostHeader
                - InternalGatewaySignature

            - id: administration
              uri: lb://administration
              predicates:
                - Path=/qonaqzhai/admin/**
              filters:
                - RewritePath=/qonaqzhai/admin/?(?<segment>.*), /${segment}
                - AuthenticationFilter

            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/qonaqzhai/events/**
              filters:
                - RewritePath=/qonaqzhai/events(?<segment>/?.*), /events${segment}
                - AuthenticationFilter
                - InternalGatewaySignature

            - id: event-service-h2-console
              uri: lb://event-service
              predicates:
                - Path=/qonaqzhai/events/h2-console,/qonaqzhai/events/h2-console/**
              filters:
                - RewritePath=/qonaqzhai/events/h2-console(?<segment>/?.*), /h2-console${segment}
                - AddRequestHeader=X-Forwarded-Prefix, /qonaqzhai/events
                - PreserveHostHeader
                - InternalGatewaySignature

            - id: event-service-items
              uri: lb://event-service
              predicates:
                - Path=/qonaqzhai/items/**
              filters:
                - RewritePath=/qonaqzhai/items(?<segment>/?.*), /items${segment}
                - AuthenticationFilter
                - InternalGatewaySignature

            - id: event-service-orders
              uri: lb://event-service
              predicates:
                - Path=/qonaqzhai/orders/**
              filters:
                - RewritePath=/qonaqzhai/orders(?<segment>/?.*), /orders${segment}
                - AuthenticationFilter
                - InternalGatewaySignature

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/qonaqzhai/ai/**
              filters:
                - RewritePath=/qonaqzhai/ai(?<segment>/?.*), /ai${segment}
                - AuthenticationFilter
                - InternalGatewaySignature


eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

security:
  internal-gateway:
    enabled: ${INTERNAL_GATEWAY_AUTH_ENABLED:true}
    secret: ${INTERNAL_GATEWAY_SECRET:M9to4I7oX0IsoWvuY13dIxgW}

logging:
  level:
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN