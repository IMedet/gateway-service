services:
  eureka:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../eureka:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8761:8761"

  auth-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../auth-service:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8081:8081"
    depends_on:
      - eureka

  event-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../event-service:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8082:8082"
    depends_on:
      - eureka

  administration:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../administration:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SERVER_PORT: "8080"
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8080:8080"
    depends_on:
      - eureka

  gateway-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      AUTH_SERVICE_URL: http://auth-service:8081
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8888:8888"
    depends_on:
      - eureka
      - auth-service
      - event-service
      - administration

volumes:
  m2:
