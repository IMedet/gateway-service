services:
  shared-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../shared:/workspace
      - m2:/root/.m2
    command: ["mvn", "-q", "-DskipTests", "install"]

  eureka:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../eureka:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8761:8761"
    depends_on:
      - shared-build

  auth-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../auth-service:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8081:8081"
    depends_on:
      - shared-build
      - eureka

  event-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../event-service:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8082:8082"
    depends_on:
      - shared-build
      - eureka

  ai-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../ai-service:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      SERVER_PORT: "8084"
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8084:8084"
    depends_on:
      - shared-build
      - eureka

  administration:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../administration:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SERVER_PORT: "8080"
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8080:8080"
    depends_on:
      - shared-build
      - eureka

  gateway-service:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - m2:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: local
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      ADMIN_SERVICE_URL: http://administration:8080
      AI_SERVICE_URL: http://ai-service:8084
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["mvn", "-q", "spring-boot:run"]
    ports:
      - "8888:8888"
    depends_on:
      - shared-build
      - eureka
      - auth-service
      - event-service
      - administration
      - ai-service

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    depends_on:
      - gateway-service
      - auth-service
      - event-service
      - administration
      - ai-service
      - eureka

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  m2:
  grafana_data:
