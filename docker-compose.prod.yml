services:
  shared-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../shared:/workspace
      - m2:/root/.m2
    command: ["mvn", "-q", "-DskipTests", "install"]

  eureka-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../eureka:/workspace
      - m2:/root/.m2
      - artifacts:/artifacts
    depends_on:
      - shared-build
    command: ["bash", "-lc", "mvn -q -DskipTests package && cp -f target/*.jar /artifacts/eureka.jar"]

  auth-service-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../auth-service:/workspace
      - m2:/root/.m2
      - artifacts:/artifacts
    depends_on:
      - shared-build
    command: ["bash", "-lc", "mvn -q -DskipTests package && cp -f target/*.jar /artifacts/auth-service.jar"]

  event-service-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../event-service:/workspace
      - m2:/root/.m2
      - artifacts:/artifacts
    depends_on:
      - shared-build
    command: ["bash", "-lc", "mvn -q -DskipTests package && cp -f target/*.jar /artifacts/event-service.jar"]

  administration-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../administration:/workspace
      - m2:/root/.m2
      - artifacts:/artifacts
    depends_on:
      - shared-build
    command: ["bash", "-lc", "mvn -q -DskipTests package && cp -f target/*.jar /artifacts/administration.jar"]

  ai-service-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ../ai-service:/workspace
      - m2:/root/.m2
      - artifacts:/artifacts
    depends_on:
      - shared-build
    command: ["bash", "-lc", "mvn -q -DskipTests package && cp -f target/*.jar /artifacts/ai-service.jar"]

  gateway-service-build:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - m2:/root/.m2
      - artifacts:/artifacts
    depends_on:
      - shared-build
    command: ["bash", "-lc", "mvn -q -DskipTests package && cp -f target/*.jar /artifacts/gateway-service.jar"]

  eureka:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      - eureka-build
    environment:
      SPRING_PROFILES_ACTIVE: prod
    command: ["java", "-jar", "/artifacts/eureka.jar"]
    ports:
      - "8761:8761"

  auth-service:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      - auth-service-build
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["java", "-jar", "/artifacts/auth-service.jar"]
    ports:
      - "8081:8081"

  event-service:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      - event-service-build
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["java", "-jar", "/artifacts/event-service.jar"]
    ports:
      - "8082:8082"

  administration:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      - administration-build
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SERVER_PORT: "8080"
    command: ["java", "-jar", "/artifacts/administration.jar"]
    ports:
      - "8080:8080"

  ai-service:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      - ai-service-build
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      SERVER_PORT: "8084"
    command: ["java", "-jar", "/artifacts/ai-service.jar"]
    ports:
      - "8084:8084"

  gateway-service:
    image: eclipse-temurin:17-jre
    working_dir: /app
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      - gateway-service-build
      - eureka
      - auth-service
      - event-service
      - administration
      - ai-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      ADMIN_SERVICE_URL: http://administration:8080
      AI_SERVICE_URL: http://ai-service:8084
      INTERNAL_GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-766SBSZ9soKRmJISfScxyGLDzht}
    command: ["java", "-jar", "/artifacts/gateway-service.jar"]
    ports:
      - "8888:8888"

volumes:
  m2:
  artifacts:
